
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">

<title>Scale dos Personagens | John</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0b0b0f;
    color: #eeeeF5;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 38px 18px 30px;
    background: #111016;
    border-bottom: 1px solid #29232f;
}

header h1 {
    font-size: clamp(23px, 5vw, 34px);
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.35;
    color: #ffffff;
}

header h1 span {
    color: #a66cff;
}

.description {
    max-width: 600px;
    margin: 15px auto 0;
    color: #aaa5b7;
    font-size: 14px;
    line-height: 1.8;
}

main {
    width: min(100% - 30px, 900px);
    margin: 30px auto;
}

.list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.list-header h2 {
    font-size: 19px;
    font-weight: 700;
    white-space: nowrap;
}

.list-header h2 span {
    color: #a66cff;
    font-weight: 400;
}

.search {
    width: 220px;
    max-width: 50%;
    padding: 11px 13px;
    background: #15141b;
    color: white;
    border: 1px solid #35303f;
    border-radius: 7px;
    font-size: 13px;
    outline: none;
}

.search:focus {
    border-color: #a66cff;
}

.search::placeholder {
    color: #858091;
}

.character-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.empty {
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 1px dashed #302a39;
    border-radius: 9px;
    color: #777283;
    font-size: 13px;
    line-height: 1.8;
    padding: 25px;
}

.character {
    background: #15141b;
    border: 1px solid #302a39;
    border-radius: 9px;
    padding: 18px;
}

.character h3 {
    font-size: 17px;
    margin-bottom: 12px;
}

.character p {
    font-size: 13px;
    color: #b2adbf;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.character .tier {
    display: block;
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid #302a39;
    color: #b68aff;
    font-size: 13px;
    font-weight: bold;
}

.hidden {
    display: none;
}

@media (max-width: 480px) {
    header {
        padding: 32px 15px 25px;
    }

    main {
        margin-top: 25px;
    }

    .list-header {
        flex-wrap: wrap;
        gap: 12px;
    }

    .list-header h2 {
        font-size: 17px;
    }

    .search {
        flex: 1;
        width: 100%;
        max-width: none;
    }
}
</style>
</head>

<body>

<header>
    <h1>
        Scale de todos os personagens<br>
        <span>que aparecerão no DEATH BATTLE do John (Abnner)</span>
    </h1>

    <p class="description">
        Escala de poder dos personagens que aparecerão
        na animação DEATH BATTLE do John.
    </p>
</header>

<main>
    <section class="list-header">
        <h2>
            Personagens:
            <span>(total: <span id="total">0</span>)</span>
        </h2>

        <input
            type="search"
            id="search"
            class="search"
            placeholder="Pesquisar..."
            aria-label="Pesquisar personagens"
        >
    </section>

    <section id="characterList" class="character-list">
        <div class="empty" id="empty">
            Nenhum personagem cadastrado.
        </div>
    </section>
</main>

<script>
const characters = [];

const list = document.getElementById("characterList");
const search = document.getElementById("search");
const total = document.getElementById("total");

function renderCharacters() {
    const query = search.value.trim().toLowerCase();

    const filtered = characters.filter(character =>
        character.name.toLowerCase().includes(query)
    );

    total.textContent = characters.length;

    list.innerHTML = "";

    if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = characters.length === 0
            ? "Nenhum personagem cadastrado."
            : "Nenhum personagem encontrado.";

        list.appendChild(empty);
        return;
    }

    filtered.forEach(character => {
        const card = document.createElement("article");
        card.className = "character";

        const name = document.createElement("h3");
        name.textContent = character.name;

        const info = document.createElement("p");
        info.textContent = character.info || "Sem informações.";

        const tier = document.createElement("div");
        tier.className = "tier";
        tier.textContent = "Tier: " + character.tier;

        card.append(name, info, tier);
        list.appendChild(card);
    });
}

search.addEventListener("input", renderCharacters);

renderCharacters();
</script>

</body>
</html>
