
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEATH BATTLE — Scale</title>
<style>
*{box-sizing:border-box}
:root{--bg:#090b10;--panel:#121620;--panel2:#191f2b;--border:#2b3342;--text:#f2f4f8;--muted:#a1aabd;--red:#d83e4c;--blue:#6688ff}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{text-align:center;padding:36px 18px 28px;background:#0d1017;border-bottom:1px solid var(--border)}
header h1{max-width:850px;margin:0 auto 14px;font-size:clamp(24px,4vw,37px);line-height:1.2}
header p{max-width:700px;margin:auto;color:var(--muted);font-size:14px;line-height:1.7}
main,#details{max-width:1050px;margin:auto;padding:25px 18px 50px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.count{font-size:15px;font-weight:bold}.count span{font-weight:normal;color:var(--muted)}
input{width:245px;max-width:55%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:7px;outline:none}
input:focus{border-color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--red)}
.card img{width:100%;height:240px;object-fit:cover;background:#171b25;display:block}
.card-body{padding:15px}.card h2{font-size:19px;margin:0 0 8px}.card p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 13px}
.tier-tag{font-size:12px;display:inline-block;padding:6px 9px;border-radius:4px;background:#27202a;color:#e9b2ff}
#details{display:none}.back{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:6px;cursor:pointer;margin-bottom:22px}
.back:hover{border-color:var(--red)}
.profile{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:24px;align-items:start}
.portrait{width:100%;max-height:450px;min-height:240px;object-fit:cover;background:var(--panel);border:1px solid var(--border);border-radius:9px}
.profile h1{font-size:clamp(28px,5vw,40px);margin:0 0 8px}.subtitle{color:var(--muted);line-height:1.6}
.section{margin-top:21px;padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:8px}
.section h2{font-size:19px;margin:0 0 14px;padding-bottom:11px;border-bottom:1px solid var(--border)}
.section p,.section li{font-size:14px;line-height:1.75;color:#c8cfdd}.section ul{padding-left:21px}
.stat{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #252c39;font-size:14px;line-height:1.5}.stat:last-child{border:0}.stat strong{color:var(--muted)}
.route{margin:15px 0;padding:15px;background:#171c27;border-left:3px solid var(--blue);border-radius:4px}.route h3{font-size:16px;margin:0 0 9px}.route p{margin:7px 0}.route .conclusion{color:#fff;font-weight:bold}
.tier-box{border-color:#70313c;background:#211319}.tier-box h2{color:#ff9ca7}.tier-name{font-size:25px;font-weight:bold;margin:8px 0 12px}
.note{color:#aab3c4!important;font-size:12px!important}
.sources a{display:block;color:#aabaff;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.sources a:last-child{border-bottom:0}.sources a:hover{color:white}
.empty{grid-column:1/-1;text-align:center;padding:40px 15px;border:1px dashed var(--border);color:var(--muted);border-radius:8px}
footer{text-align:center;padding:23px;color:#788297;border-top:1px solid var(--border);font-size:12px}
@media(max-width:650px){.profile{grid-template-columns:1fr}.portrait{max-height:380px}.toolbar{align-items:center}.stat{grid-template-columns:115px 1fr}}
</style>
</head>
<body>
<header id="heading">
<h1>Scale de todos os personagens que aparecerão no DEATH BATTLE do John (Abnner)</h1>
<p>Apresentações, feitos, vias de escala, habilidades e tiers dos personagens que participarão das animações DEATH BATTLE.</p>
</header>
<main id="home">
<div class="toolbar"><div class="count">Personagens: <span>(total: <span id="total">6</span>)</span></div><input id="search" type="search" placeholder="Pesquisar..." aria-label="Pesquisar personagens"></div>
<div class="cards" id="cards"></div>
</main>
<section id="details"><button class="back" id="back">Voltar para personagens</button><div id="content"></div></section>
<footer>DEATH BATTLE — John (Abnner)</footer>

 stats:[["Força","Parede"],["Velocidade","Não calculada de forma confiável"],["Durabilidade","Não estabelecida com precisão"],["Arma principal","Compasso incorporado ao braço"],["Habilidades","Combate corpo a corpo, perseguição e intimidação"],["Tier declarado","Parede"]],

 routes:[
 {title:"Via 1 — Ataques com o compasso",feat:"Em Basics in Behavior, Miss Circle usa seu compasso para ameaçar e atacar alunos.",scaling:"Para esta DEATH BATTLE, esses ataques são escalados para Parede, de acordo com a declaração do criador.",result:"Parede.",caution:"O tier é a regra da animação; cenas específicas precisariam de cálculos para demonstrar um valor independente."},
 {title:"Via 2 — Força e perseguição",feat:"Miss Circle consegue perseguir os alunos e usar sua arma em combates a curta distância.",scaling:"Esses elementos sustentam seu papel de ameaça física dentro do ambiente escolar.",result:"Combate corpo a corpo e pressão sobre o adversário.",caution:"A altura e a aparência ameaçadora não provam, por si só, um nível superior de destruição."}
 ],

},
{

 stats:[["Inteligência","Gênio científico e estrategista"],["Força","Depende da armadura, magia e amplificações"],["Durabilidade","Depende da armadura, escudos e magia"],["Habilidades","Feitiçaria, tecnologia, campos de força e Doombots"],["Tier declarado","Complex Multiversal"]],

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderCards(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const results=characters.filter(c=>c.name.toLowerCase().includes(q)||c.subtitle.toLowerCase().includes(q));
 document.getElementById("total").textContent=characters.length;
 if(!results.length){cards.innerHTML='<div class="empty">Nenhum personagem encontrado.</div>';return;}
 cards.innerHTML=results.map(c=>`<article class="card" tabindex="0" role="button" data-id="${esc(c.id)}"><img src="${esc(c.image)}" alt="${esc(c.name)}" onerror="this.style.display='none'"><div class="card-body"><h2>${esc(c.name)}</h2><p>${esc(c.subtitle)}</p><span class="tier-tag">${esc(c.conclusion)}</span></div></article>`).join("");
}
function openCharacter(id){
 const c=characters.find(x=>x.id===id);if(!c)return;
 heading.style.display="none";home.style.display="none";details.style.display="block";
 const stats=c.stats.map(([a,b])=>`<div class="stat"><strong>${esc(a)}</strong><span>${esc(b)}</span></div>`).join("");
 const powers=c.powers.map(x=>`<li>${esc(x)}</li>`).join("");
 const routes=c.routes.map(r=>`<div class="route"><h3>${esc(r.title)}</h3><p><strong>Feito:</strong> ${esc(r.feat)}</p><p><strong>Interpretação da via:</strong> ${esc(r.scaling)}</p><p class="conclusion">${esc(r.result)}</p><p class="note"><strong>Limite da evidência:</strong> ${esc(r.caution)}</p></div>`).join("");
 const sources=c.sources.map(([title,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>`).join("");
 content.innerHTML=`<div class="profile"><img class="portrait" src="${esc(c.image)}" alt="${esc(c.name)}" onerror="this.style.display='none'"><div><h1>${esc(c.name)}</h1><p class="subtitle">${esc(c.subtitle)}</p><p style="line-height:1.8;color:#d0d5e0">${esc(c.introduction)}</p><section class="section"><h2>Estatísticas</h2>${stats}</section></div></div><section class="section"><h2>Poderes e habilidades</h2><ul>${powers}</ul></section><section class="section"><h2>Feitos e vias de escala</h2>${routes}</section><section class="section tier-box"><h2>Tier final da DEATH BATTLE</h2><div class="tier-name">${esc(c.conclusion)}</div><p>${esc(c.tierNote)}</p></section><section class="section sources"><h2>Fontes e referências</h2><p>Abra os links para conferir as fontes originais e as interpretações usadas.</p>${sources}</section>`;
 window.scrollTo(0,0);
}
cards.addEventListener("click",e=>{const card=e.target.closest(".card");if(card)openCharacter(card.dataset.id);});
cards.addEventListener("keydown",e=>{const card=e.target.closest(".card");if(card&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openCharacter(card.dataset.id);}});
document.getElementById("back").addEventListener("click",()=>{details.style.display="none";heading.style.display="block";home.style.display="block";window.scrollTo(0,0);});
document.getElementById("search").addEventListener("input",renderCards);
renderCards();
</script>
</body>
</html>
